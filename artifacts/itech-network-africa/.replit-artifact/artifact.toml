kind = "web"
previewPath = "/"
title = "iTech Network Africa"
version = "1.0.0"
id = "artifacts/itech-network-africa"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5173

[services.development]
run = "pnpm --filter @workspace/itech-network-africa run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/itech-network-africa", "run", "build" ]
serve = "static"
publicDir = "artifacts/itech-network-africa/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5173"
BASE_PATH = "/"
